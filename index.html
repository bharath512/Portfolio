<!doctype html>
<html lang="en" class="scroll-pt-20 motion-safe:scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>%site.title%</title>
    <meta name="description" content="%site.description%" />
    <meta name="author" content="%site.name%" />
    <meta name="theme-color" content="%site.themeColor%" />
    <link rel="canonical" href="%site.url%/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- The hero photo is the LCP element but is rendered by JS, so hint it here. Vite rewrites the path to the hashed file. -->
    <link rel="preload" as="image" href="/src/assets/img/profile-portrait.webp" fetchpriority="high" />

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%site.name%" />
    <meta property="og:title" content="%site.title%" />
    <meta property="og:description" content="%site.description%" />
    <meta property="og:url" content="%site.url%/" />
    <meta property="og:image" content="%site.ogImage%" />
    <meta property="og:image:alt" content="%site.ogImageAlt%" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%site.title%" />
    <meta name="twitter:description" content="%site.description%" />
    <meta name="twitter:image" content="%site.ogImage%" />
  </head>

  <body class="bg-paper font-sans text-lg text-ink antialiased">
    <a
      href="#main"
      class="fixed left-4 top-4 z-[60] -translate-y-24 bg-white px-4 py-2 font-display text-xl uppercase text-navy-950 focus:translate-y-0"
      >Skip to content</a
    >
    <div id="app"></div>
    <noscript>
      <p class="p-8">
        This portfolio is rendered with JavaScript. You can reach Bharath R at
        <a class="underline" href="mailto:rbharath0512@gmail.com">rbharath0512@gmail.com</a> or on
        <a class="underline" href="https://www.linkedin.com/in/r-bharath/">LinkedIn</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
